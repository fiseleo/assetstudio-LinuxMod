[package]
name = "naga-c"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WGSL to SPIR-V through naga, with a C interface (AssetStudio's game shader preview of WebGPU programs)"

[lib]
name = "naga_c"
crate-type = ["cdylib"]

[dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
